<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.sq{position:absolute;inset:60px;border-radius:230px;background:linear-gradient(160deg,#1c5cab 0%,#2a78d6 55%,#3987e5 100%);
box-shadow:inset 0 -30px 60px rgba(0,0,0,.18), inset 0 30px 60px rgba(255,255,255,.12)}
.ring{position:absolute;left:212px;top:212px;width:600px;height:600px;border-radius:50%;border:34px solid rgba(255,255,255,.92);box-sizing:border-box}
.tick{position:absolute;left:502px;top:150px;width:20px;height:60px;background:#fff;border-radius:10px;transform-origin:10px 362px}
.needle{position:absolute;left:512px;top:512px;width:0;height:0}
.n{position:absolute;left:-52px;top:-240px;width:0;height:0;border-left:52px solid transparent;border-right:52px solid transparent;border-bottom:240px solid #e34948}
.s{position:absolute;left:-52px;top:0;width:0;height:0;border-left:52px solid transparent;border-right:52px solid transparent;border-top:240px solid #fff}
.hub{position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:50%;background:#0d366b;border:12px solid #fff;box-sizing:border-box}
</style></head><body><div class="sq"></div><div class="ring"></div>
<div class="tick"></div><div class="tick" style="transform:rotate(90deg)"></div><div class="tick" style="transform:rotate(180deg)"></div><div class="tick" style="transform:rotate(270deg)"></div>
<div class="needle" style="transform:rotate(35deg)"><div class="n"></div><div class="s"></div><div class="hub"></div></div></body></html>
